<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhotoU — Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  min-height:100vh;background:#0d0020;
  font-family:'DM Sans',sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden; position:relative;
}
.bg-mesh{
  position:fixed;inset:0;
  background:radial-gradient(ellipse 70% 60% at 30% 50%,#3b1060 0%,transparent 65%),
             radial-gradient(ellipse 50% 70% at 80% 30%,#1a004d 0%,transparent 60%),
             #0d0020;
}
.bg-orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:0.3;animation:orbF 8s ease-in-out infinite;}
.o1{width:400px;height:400px;background:#8b2fc9;top:-80px;left:-80px;}
.o2{width:350px;height:350px;background:#f43f8a;bottom:-60px;right:-60px;animation-delay:4s;}
@keyframes orbF{0%,100%{transform:translate(0,0);}50%{transform:translate(20px,-20px);}}

.login-card{
  position:relative;z-index:10;width:400px;
  background:rgba(255,255,255,0.05);backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,0.1);border-radius:28px;
  padding:48px 40px; box-shadow:0 40px 100px rgba(0,0,0,0.6);
  animation:slideIn 0.7s cubic-bezier(.22,1,.36,1) both;
}
@keyframes slideIn{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:none;}}

.logo-row{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:36px;}
.logo-icon{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#8b2fc9,#f43f8a);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 12px 36px rgba(139,47,201,0.45);}
.logo-title{font-family:'Pacifico',cursive;font-size:32px;background:linear-gradient(135deg,#e879f9,#f43f8a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo-sub{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:3px;color:rgba(255,255,255,0.4);text-transform:uppercase;}

.field-group{display:flex;flex-direction:column;gap:14px;margin-bottom:24px;}
.field{display:flex;flex-direction:column;gap:7px;}
.field label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,0.5);text-transform:uppercase;}
.field input{
  width:100%;padding:13px 16px;
  background:rgba(255,255,255,0.07);
  border:1.5px solid rgba(255,255,255,0.12);
  border-radius:12px;color:white;font-family:'DM Sans',sans-serif;font-size:15px;
  outline:none;transition:all 0.2s;
}
.field input:focus{border-color:rgba(196,132,252,0.6);background:rgba(255,255,255,0.1);box-shadow:0 0 0 3px rgba(196,132,252,0.15);}
.field input::placeholder{color:rgba(255,255,255,0.25);}

.login-btn{
  width:100%;padding:15px;border:none;border-radius:14px;
  background:linear-gradient(135deg,#8b2fc9,#f43f8a);
  color:white;font-family:'Space Mono',monospace;font-size:13px;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  box-shadow:0 10px 32px rgba(139,47,201,0.45);transition:all 0.2s;
}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(244,63,138,0.5);}
.login-btn:active{transform:translateY(0);}

.error-msg{
  text-align:center;font-family:'Space Mono',monospace;font-size:11px;
  letter-spacing:1px;color:#f87171;background:rgba(248,113,113,0.1);
  border:1px solid rgba(248,113,113,0.3);border-radius:10px;padding:10px;
  display:none;
}
.error-msg.show{display:block;}

.back-link{
  display:block;text-align:center;margin-top:20px;
  font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;
  color:rgba(255,255,255,0.35);text-decoration:none;transition:color 0.2s;
}
.back-link:hover{color:rgba(255,255,255,0.7);}

.hint-box{
  margin-top:18px;padding:12px 16px;border-radius:10px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
  font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;
  color:rgba(255,255,255,0.25);text-align:center;line-height:1.8;
}
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="bg-orb o1"></div>
<div class="bg-orb o2"></div>

<div class="login-card">
  <div class="logo-row">
    <div class="logo-icon">🔐</div>
    <div class="logo-title">PhotoU</div>
    <div class="logo-sub">Admin Access Only</div>
  </div>

  <div class="field-group">
    <div class="field">
      <label>Username</label>
      <input type="text" id="userInput" placeholder="admin" autocomplete="off">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="passInput" placeholder="••••••••" autocomplete="off">
    </div>
  </div>

  <div class="error-msg" id="errMsg">❌ Invalid username or password</div>

  <button class="login-btn" onclick="doLogin()">🔓 SIGN IN</button>

  <a href="index.html" class="back-link">← Back to PhotoU</a>

  <div class="hint-box">
    Default credentials: admin / photou2025<br>
    This area is for administrators only.
  </div>
</div>

<script src="db.js"></script>
<script>
// If already admin, redirect
if (DB.isAdmin()) window.location.href = 'admin.html';

document.getElementById('passInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('userInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('passInput').focus();
});

function doLogin() {
  const u = document.getElementById('userInput').value.trim();
  const p = document.getElementById('passInput').value;
  const err = document.getElementById('errMsg');
  if (DB.login(u, p)) {
    window.location.href = 'admin.html';
  } else {
    err.classList.add('show');
    document.getElementById('passInput').value = '';
    document.getElementById('passInput').focus();
    setTimeout(() => err.classList.remove('show'), 3000);
  }
}
</script>
</body>
</html>
