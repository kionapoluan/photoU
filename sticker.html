<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhotoU — Add Stickers</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--pink:#f43f8a;--purple:#8b2fc9;--lav:#c084fc;--dark:#0d0020;}
body{height:100vh;overflow:hidden;background:var(--dark);font-family:'DM Sans',sans-serif;display:flex;flex-direction:column;}
.bg-mesh{position:fixed;inset:0;background:radial-gradient(ellipse 60% 70% at 10% 50%,#2a0550 0%,transparent 60%),radial-gradient(ellipse 50% 60% at 90% 20%,#1a003a 0%,transparent 60%),#0d0020;z-index:0;}

.topbar{position:relative;z-index:10;display:flex;align-items:center;gap:12px;padding:11px 22px;background:rgba(13,0,32,0.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.07);flex-shrink:0;}
.logo{font-family:'Pacifico',cursive;font-size:22px;background:linear-gradient(135deg,#e879f9,#f43f8a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.page-title{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:3px;color:rgba(255,255,255,0.4);text-transform:uppercase;}
.back-btn{margin-left:auto;padding:6px 16px;border-radius:20px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.65);font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;text-decoration:none;transition:all 0.2s;}
.back-btn:hover{background:rgba(255,255,255,0.12);color:white;}

/* Mode indicator */
.mode-badge{padding:4px 12px;border-radius:20px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1.5px;transition:all 0.3s;}
.mode-badge.sticker-mode{background:rgba(192,132,252,0.15);border:1px solid rgba(192,132,252,0.3);color:#c084fc;}
.mode-badge.photo-mode{background:rgba(244,63,138,0.15);border:1px solid rgba(244,63,138,0.3);color:#f43f8a;animation:pulseBadge 1.5s ease infinite;}
@keyframes pulseBadge{0%,100%{opacity:1;}50%{opacity:0.6;}}

.main{display:flex;flex:1;overflow:hidden;position:relative;z-index:1;}

.panel-left{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;position:relative;}
.canvas-wrap{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,0.6);background:white;}
#mainCanvas{display:block;touch-action:none;}
.canvas-hint{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,0.35);text-align:center;}

/* ── Photo adjust panel (muncul saat slot dipilih) ── */
.photo-adjust-bar{
  display:none;flex-direction:row;align-items:center;gap:10px;
  background:rgba(13,0,32,0.9);backdrop-filter:blur(16px);
  border:1px solid rgba(244,63,138,0.35);border-radius:14px;
  padding:10px 16px;min-width:320px;
}
.photo-adjust-bar.visible{display:flex;}
.adj-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1.5px;color:rgba(255,255,255,0.5);white-space:nowrap;}
.adj-slider{flex:1;accent-color:var(--pink);min-width:60px;}
.adj-sep{width:1px;height:22px;background:rgba(255,255,255,0.12);}
.adj-close{padding:4px 10px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.5);font-family:'Space Mono',monospace;font-size:9px;cursor:pointer;white-space:nowrap;}
.adj-close:hover{background:rgba(255,255,255,0.12);color:white;}

.panel-right{width:240px;flex-shrink:0;display:flex;flex-direction:column;background:rgba(255,255,255,0.03);backdrop-filter:blur(12px);border-left:1px solid rgba(255,255,255,0.07);padding:14px;gap:10px;overflow:hidden;}
.panel-right h2{font-size:10px;font-family:'Space Mono',monospace;letter-spacing:2px;color:rgba(255,255,255,0.5);text-transform:uppercase;}

/* Mode toggle */
.mode-toggle{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:4px;}
.mode-btn{padding:7px;border-radius:7px;border:none;background:transparent;color:rgba(255,255,255,0.45);font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;cursor:pointer;transition:all 0.18s;}
.mode-btn.active{background:linear-gradient(135deg,var(--purple),var(--pink));color:white;}

.sticker-cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px;}
.scat{padding:4px 11px;border-radius:14px;font-size:9px;font-family:'Space Mono',monospace;border:1px solid rgba(255,255,255,0.1);background:transparent;color:rgba(255,255,255,0.45);cursor:pointer;transition:all 0.16s;letter-spacing:1px;}
.scat.active,.scat:hover{background:linear-gradient(135deg,var(--purple),var(--pink));color:white;border-color:transparent;}

.sticker-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;overflow-y:auto;padding:2px;align-content:start;}
.sticker-grid::-webkit-scrollbar{width:3px;}
.sticker-grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:3px;}
.sticker-item{aspect-ratio:1;background:rgba(255,255,255,0.06);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:all 0.18s;border:1.5px solid transparent;}
.sticker-item:hover{background:rgba(196,132,252,0.2);border-color:var(--lav);transform:scale(1.1);}
.sticker-item.selected{background:rgba(196,132,252,0.25);border-color:var(--lav);}

/* Photo mode panel */
.photo-mode-panel{display:none;flex-direction:column;gap:8px;flex:1;}
.photo-mode-panel.visible{display:flex;}
.sticker-mode-panel{display:flex;flex-direction:column;gap:8px;flex:1;overflow:hidden;}

.slot-list{display:flex;flex-direction:column;gap:6px;overflow-y:auto;}
.slot-item{padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.07);cursor:pointer;transition:all 0.18s;display:flex;align-items:center;gap:8px;}
.slot-item:hover{background:rgba(255,255,255,0.07);}
.slot-item.active{background:rgba(244,63,138,0.1);border-color:rgba(244,63,138,0.4);}
.slot-num{font-family:'Space Mono',monospace;font-size:18px;font-weight:700;color:rgba(255,255,255,0.2);width:24px;}
.slot-num.active-num{color:var(--pink);}
.slot-info{flex:1;}
.slot-name{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;color:rgba(255,255,255,0.7);}
.slot-sub{font-family:'Space Mono',monospace;font-size:8px;color:rgba(255,255,255,0.3);margin-top:2px;}
.slot-edit-icon{font-size:14px;opacity:0.5;}

.photo-controls-box{background:rgba(255,255,255,0.04);border-radius:12px;padding:10px;border:1px solid rgba(255,255,255,0.07);display:none;}
.photo-controls-box.visible{display:block;}
.ctrl-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.ctrl-row:last-child{margin-bottom:0;}
.ctrl-label{font-family:'Space Mono',monospace;font-size:9px;color:rgba(255,255,255,0.4);letter-spacing:1px;width:50px;}
.ctrl-slider{flex:1;accent-color:var(--lav);}
.ctrl-val{font-family:'Space Mono',monospace;font-size:9px;color:rgba(255,255,255,0.3);width:28px;text-align:right;}

.reset-slot-btn{width:100%;padding:7px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.5);border-radius:8px;font-family:'Space Mono',monospace;font-size:9px;cursor:pointer;letter-spacing:1px;transition:all 0.18s;margin-top:6px;}
.reset-slot-btn:hover{background:rgba(255,255,255,0.08);}

.sticker-controls{background:rgba(255,255,255,0.04);border-radius:12px;padding:10px;border:1px solid rgba(255,255,255,0.07);}
.delete-sticker-btn{width:100%;padding:7px;background:rgba(244,63,138,0.1);border:1px solid rgba(244,63,138,0.25);color:var(--pink);border-radius:8px;font-family:'Space Mono',monospace;font-size:9px;cursor:pointer;letter-spacing:1px;transition:all 0.18s;}
.delete-sticker-btn:hover{background:rgba(244,63,138,0.2);}

.next-btn{display:block;width:100%;padding:14px;background:linear-gradient(135deg,var(--purple),var(--pink));color:white;border:none;border-radius:14px;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all 0.2s;box-shadow:0 6px 20px rgba(139,47,201,0.4);flex-shrink:0;}
.next-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(244,63,138,0.5);}
.next-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none!important;}

/* Photo drag overlay hint */
.drag-hint{
  position:absolute;pointer-events:none;
  font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1.5px;
  color:white;background:rgba(244,63,138,0.85);
  padding:3px 9px;border-radius:20px;
  opacity:0;transition:opacity 0.3s;
  white-space:nowrap;
}
.drag-hint.show{opacity:1;}
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="topbar">
  <span class="logo">PhotoU</span>
  <span class="page-title">Add Stickers</span>
  <span class="mode-badge sticker-mode" id="modeBadge">STICKER MODE</span>
  <a href="booth.html" class="back-btn">← Back</a>
</div>
<div class="main">
  <div class="panel-left">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="mainCanvas"></canvas>
      <div class="drag-hint" id="dragHint">DRAG TO REPOSITION</div>
    </div>
    <p class="canvas-hint" id="canvasHint">TAP STICKER → DRAG TO POSITION</p>

    <!-- Photo adjust bar (muncul saat photo mode & slot dipilih) -->
    <div class="photo-adjust-bar" id="photoAdjBar">
      <span class="adj-label">ZOOM</span>
      <input type="range" class="adj-slider" id="adjZoom" min="100" max="300" value="100" step="1">
      <span class="adj-sep"></span>
      <span class="adj-label">H-POS</span>
      <input type="range" class="adj-slider" id="adjX" min="-100" max="100" value="0" step="1">
      <span class="adj-sep"></span>
      <span class="adj-label">V-POS</span>
      <input type="range" class="adj-slider" id="adjY" min="-100" max="100" value="0" step="1">
      <span class="adj-sep"></span>
      <button class="adj-close" onclick="closePhotoAdjust()">✓ DONE</button>
    </div>
  </div>

  <div class="panel-right">
    <h2 id="panelTitle">Stickers</h2>

    <!-- Mode toggle -->
    <div class="mode-toggle">
      <button class="mode-btn active" id="modeBtnSticker" onclick="setMode('sticker')">🎨 STICKER</button>
      <button class="mode-btn" id="modeBtnPhoto" onclick="setMode('photo')">📸 PHOTO</button>
    </div>

    <!-- ── STICKER MODE ── -->
    <div class="sticker-mode-panel" id="stickerModePanel">
      <div class="sticker-cats">
        <button class="scat active" data-cat="all">All</button>
        <button class="scat" data-cat="face">Face</button>
        <button class="scat" data-cat="nature">Nature</button>
        <button class="scat" data-cat="fun">Fun</button>
      </div>
      <div class="sticker-grid" id="stickerGrid"></div>
      <div class="sticker-controls">
        <p style="font-family:'Space Mono',monospace;font-size:9px;color:rgba(255,255,255,0.35);letter-spacing:1px;margin-bottom:6px;">SELECTED STICKER</p>
        <div class="ctrl-row">
          <span class="ctrl-label">SIZE</span>
          <input type="range" class="ctrl-slider" id="sizeSlider" min="20" max="120" value="50">
        </div>
        <div class="ctrl-row">
          <span class="ctrl-label">ROTATE</span>
          <input type="range" class="ctrl-slider" id="rotSlider" min="-180" max="180" value="0">
        </div>
        <button class="delete-sticker-btn" onclick="deleteSelected()">✕ REMOVE STICKER</button>
      </div>
    </div>

    <!-- ── PHOTO MODE ── -->
    <div class="photo-mode-panel" id="photoModePanel">
      <p style="font-family:'Space Mono',monospace;font-size:9px;color:rgba(255,255,255,0.4);letter-spacing:1px;">TAP SLOT TO ADJUST PHOTO</p>
      <div class="slot-list" id="slotList"></div>
      <div class="photo-controls-box" id="photoControlsBox">
        <p style="font-family:'Space Mono',monospace;font-size:9px;color:rgba(255,255,255,0.35);letter-spacing:1px;margin-bottom:8px;">PHOTO ADJUST</p>
        <div class="ctrl-row">
          <span class="ctrl-label">ZOOM</span>
          <input type="range" class="ctrl-slider" id="zoomSlider" min="100" max="300" value="100">
          <span class="ctrl-val" id="zoomVal">100%</span>
        </div>
        <div class="ctrl-row">
          <span class="ctrl-label">H-POS</span>
          <input type="range" class="ctrl-slider" id="xSlider" min="-100" max="100" value="0">
          <span class="ctrl-val" id="xVal">0</span>
        </div>
        <div class="ctrl-row">
          <span class="ctrl-label">V-POS</span>
          <input type="range" class="ctrl-slider" id="ySlider" min="-100" max="100" value="0">
          <span class="ctrl-val" id="yVal">0</span>
        </div>
        <button class="reset-slot-btn" onclick="resetCurrentSlot()">↺ RESET PHOTO</button>
      </div>
    </div>

    <button class="next-btn" id="nextBtn" onclick="goNext()">NEXT →</button>
  </div>
</div>

<script src="db.js"></script>
<script>
DB.logVisitor('sticker');

// ══════════════════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════════════════
const frameData  = JSON.parse(localStorage.getItem('selectedFrame') || '{}');
const SLOTS      = Math.max(1, Math.min(4, parseInt(frameData.slots) || 3));
const FRAME_TYPE = frameData.type || 'generated';

// Ukuran canvas preview
const PREVIEW_W  = 280;
const SLOT_H     = 100;
const SLOT_GAP   = 8;
const HEADER_H   = 54;
const FOOTER_H   = 34;
const PAD        = 16;
const PREVIEW_H  = HEADER_H + PAD + (SLOT_H * SLOTS) + (SLOT_GAP * (SLOTS - 1)) + PAD + FOOTER_H;

const HD_SCALE   = DB.HD_SCALE || 3;
const HD_W       = PREVIEW_W * HD_SCALE;
const HD_H       = PREVIEW_H * HD_SCALE;

// ── Setup canvas ──────────────────────────────────────────────
const canvas = document.getElementById('mainCanvas');
canvas.width  = PREVIEW_W;
canvas.height = PREVIEW_H;
const ctx = canvas.getContext('2d');

// ── Photo adjust state per slot ───────────────────────────────
// photoAdj[i] = { zoom: 1.0, ox: 0, oy: 0 }
// ox/oy adalah offset dalam % relatif terhadap slot
const photoAdj = Array.from({length: SLOTS}, () => ({ zoom: 1.0, ox: 0, oy: 0 }));

// ── Sticker state ─────────────────────────────────────────────
let placed = [], dragging = null, selIdx = null, dragOffX = 0, dragOffY = 0;

// ── Mode: 'sticker' | 'photo' ────────────────────────────────
let currentMode = 'sticker';
let activePhotoSlot = null; // index slot yang sedang diedit

// ── Photo drag state (photo mode) ────────────────────────────
let photoDragging = false;
let photoDragSlot = null;
let photoDragStartX = 0, photoDragStartY = 0;
let photoDragStartOx = 0, photoDragStartOy = 0;

// ── Foto dari localStorage ────────────────────────────────────
const photos = Array.from({length: SLOTS}, (_, i) => localStorage.getItem(`photo${i}`));
const preloadedImgs = Array(SLOTS).fill(null);
let pngFrameImg = null;

// ══════════════════════════════════════════════════════════════
// PRELOAD
// ══════════════════════════════════════════════════════════════
function preloadAll(callback) {
  const toLoad = [];
  photos.forEach((src, i) => {
    if (!src) return;
    toLoad.push(new Promise(res => {
      const im = new Image();
      im.onload  = () => { preloadedImgs[i] = im; res(); };
      im.onerror = () => res();
      im.src = src;
    }));
  });
  if (FRAME_TYPE === 'png' && frameData.imageUrl) {
    toLoad.push(new Promise(res => {
      const im = new Image();
      im.onload  = () => { pngFrameImg = im; res(); };
      im.onerror = () => res();
      im.src = frameData.imageUrl;
    }));
  }
  Promise.all(toLoad).then(callback);
}

// ══════════════════════════════════════════════════════════════
// SLOT GEOMETRY HELPER
// ══════════════════════════════════════════════════════════════
function getSlotRect(i, scale) {
  scale = scale || 1;
  const headerH = HEADER_H * scale;
  const pad     = PAD      * scale;
  const slotH   = SLOT_H   * scale;
  const slotGap = SLOT_GAP * scale;
  const sx      = PAD      * scale;
  const sw      = (PREVIEW_W - PAD * 2) * scale;
  const sy      = headerH + pad + i * (slotH + slotGap);
  return { x: sx, y: sy, w: sw, h: slotH };
}

function hitSlot(px, py) {
  for (let i = 0; i < SLOTS; i++) {
    const r = getSlotRect(i, 1);
    if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) return i;
  }
  return -1;
}

// ══════════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════════
function drawPhotoInSlot(targetCtx, im, adj, sx, sy, sw, sh, br) {
  const zoom = adj ? adj.zoom : 1.0;
  const ox   = adj ? adj.ox   : 0;
  const oy   = adj ? adj.oy   : 0;

  // Base scale agar foto cover slot
  const baseSc = Math.max(sw / im.naturalWidth, sh / im.naturalHeight);
  const sc = baseSc * zoom;

  const dw = im.naturalWidth  * sc;
  const dh = im.naturalHeight * sc;

  // Center + offset (ox/oy adalah % dari surplus)
  const surplusX = dw - sw;
  const surplusY = dh - sh;
  const dx = sx + (sw - dw) / 2 - (ox / 100) * surplusX * 0.5;
  const dy = sy + (sh - dh) / 2 - (oy / 100) * surplusY * 0.5;

  targetCtx.save();
  targetCtx.beginPath();
  if (targetCtx.roundRect) targetCtx.roundRect(sx, sy, sw, sh, br || 0);
  else targetCtx.rect(sx, sy, sw, sh);
  targetCtx.clip();
  targetCtx.drawImage(im, dx, dy, dw, dh);
  targetCtx.restore();
}

function renderToCanvas(targetCtx, W, H, scale, includeStickers) {
  targetCtx.clearRect(0, 0, W, H);

  const headerH = HEADER_H * scale;
  const footerH = FOOTER_H * scale;
  const pad     = PAD      * scale;
  const slotH   = SLOT_H   * scale;
  const slotGap = SLOT_GAP * scale;
  const sx      = PAD      * scale;
  const sw      = W - PAD * 2 * scale;
  const br      = (frameData.radius || 8) * scale;

  if (FRAME_TYPE === 'png' && pngFrameImg) {
    targetCtx.drawImage(pngFrameImg, 0, 0, W, H);
    for (let i = 0; i < SLOTS; i++) {
      const r = getSlotRect(i, scale);
      if (preloadedImgs[i]) {
        drawPhotoInSlot(targetCtx, preloadedImgs[i], photoAdj[i], r.x, r.y, r.w, r.h, 6 * scale);
      }
    }
  } else {
    const bw = (frameData.borderW || 6) / 100 * W;

    targetCtx.fillStyle = frameData.bg || '#fff0f8';
    targetCtx.fillRect(0, 0, W, H);
    drawPattern(targetCtx, W, H, frameData.style || 'minimal', frameData.slot || '#eee', scale);

    targetCtx.strokeStyle = frameData.border || '#8b2fc9';
    targetCtx.lineWidth   = bw;
    targetCtx.beginPath();
    if (targetCtx.roundRect) targetCtx.roundRect(bw/2, bw/2, W-bw, H-bw, br);
    else targetCtx.rect(bw/2, bw/2, W-bw, H-bw);
    targetCtx.stroke();

    // Header
    targetCtx.fillStyle = frameData.border || '#8b2fc9';
    targetCtx.fillRect(0, 0, W, headerH);
    targetCtx.fillStyle = 'white';
    targetCtx.font = `bold ${16 * scale}px 'Pacifico', cursive`;
    targetCtx.textAlign = 'center';
    targetCtx.fillText(frameData.label || 'PhotoU', W / 2, headerH * 0.63);

    for (let i = 0; i < SLOTS; i++) {
      const r = getSlotRect(i, scale);
      targetCtx.fillStyle = frameData.slot || '#f0e0f8';
      targetCtx.beginPath();
      if (targetCtx.roundRect) targetCtx.roundRect(r.x, r.y, r.w, r.h, br * 0.5);
      else targetCtx.rect(r.x, r.y, r.w, r.h);
      targetCtx.fill();

      if (preloadedImgs[i]) {
        drawPhotoInSlot(targetCtx, preloadedImgs[i], photoAdj[i], r.x, r.y, r.w, r.h, br * 0.5);
      } else {
        targetCtx.fillStyle = frameData.text || '#8b2fc9';
        targetCtx.font = `${24 * scale}px sans-serif`;
        targetCtx.textAlign = 'center';
        targetCtx.fillText('📷', W / 2, r.y + r.h / 2 + 8 * scale);
      }
    }

    // Footer
    targetCtx.fillStyle = (frameData.slot || '#f0e0f8') + 'cc';
    targetCtx.fillRect(0, H - footerH, W, footerH);
    targetCtx.fillStyle = frameData.text || '#8b2fc9';
    targetCtx.font = `bold ${11 * scale}px 'Space Mono', monospace`;
    targetCtx.textAlign = 'center';
    targetCtx.fillText(frameData.label || 'PhotoU ✦', W / 2, H - footerH * 0.35);

    if (frameData.stickers && frameData.stickers.length) {
      const fsz = W * 0.1;
      targetCtx.font = `${fsz}px serif`;
      const corners = [{x:0.1,y:0.06},{x:0.9,y:0.06},{x:0.1,y:0.96},{x:0.9,y:0.96}];
      frameData.stickers.slice(0,4).forEach((s, i) => {
        const p = corners[i % corners.length];
        targetCtx.textAlign = 'center';
        targetCtx.fillText(s, W * p.x, H * p.y);
      });
    }
  }

  // Highlight active slot (hanya di preview, saat photo mode)
  if (includeStickers && currentMode === 'photo' && activePhotoSlot !== null && targetCtx === ctx) {
    const r = getSlotRect(activePhotoSlot, 1);
    targetCtx.strokeStyle = '#f43f8a';
    targetCtx.lineWidth = 2;
    targetCtx.setLineDash([5, 3]);
    targetCtx.beginPath();
    if (targetCtx.roundRect) targetCtx.roundRect(r.x - 1, r.y - 1, r.w + 2, r.h + 2, 6);
    else targetCtx.rect(r.x - 1, r.y - 1, r.w + 2, r.h + 2);
    targetCtx.stroke();
    targetCtx.setLineDash([]);
  }

  // User stickers
  if (includeStickers) {
    placed.forEach((s, i) => {
      targetCtx.save();
      targetCtx.translate(s.x * scale, s.y * scale);
      targetCtx.rotate(s.rot * Math.PI / 180);
      targetCtx.font = `${s.size * scale}px sans-serif`;
      targetCtx.textAlign = 'center';
      targetCtx.textBaseline = 'middle';
      if (i === selIdx && targetCtx === ctx && currentMode === 'sticker') {
        targetCtx.strokeStyle = 'rgba(196,132,252,0.7)';
        targetCtx.lineWidth = 2;
        targetCtx.setLineDash([]);
        targetCtx.strokeRect(-s.size * scale / 2 - 4, -s.size * scale / 2 - 4, s.size * scale + 8, s.size * scale + 8);
      }
      targetCtx.fillText(s.emoji, 0, 0);
      targetCtx.restore();
    });
  }
}

function drawPattern(ctx, W, H, style, color, scale) {
  if (style === 'dots') {
    ctx.fillStyle = color + '70';
    const sp = 18 * scale;
    for (let x = sp * 0.67; x < W; x += sp)
      for (let y = sp * 0.67; y < H; y += sp) {
        ctx.beginPath(); ctx.arc(x, y, 3 * scale, 0, Math.PI * 2); ctx.fill();
      }
  } else if (style === 'grid') {
    ctx.strokeStyle = color + '50'; ctx.lineWidth = scale;
    const sp = 18 * scale;
    for (let x = 0; x < W; x += sp) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = 0; y < H; y += sp) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  } else if (style === 'floral' || style === 'sakura') {
    for (let i = 0; i < 10; i++) {
      const a = (i/10)*Math.PI*2, cx = Math.cos(a)*W*0.42+W/2, cy = Math.sin(a)*H*0.45+H/2;
      ctx.beginPath(); ctx.ellipse(cx, cy, W*0.07, W*0.13, a, 0, Math.PI*2);
      ctx.fillStyle = color + '88'; ctx.fill();
    }
  } else if (style === 'leaves') {
    ctx.fillStyle = color + '88';
    for (let i = 0; i < 12; i++) {
      const lx = (i%4)*(W/3.5)+6, ly = Math.floor(i/4)*(H*0.38)+8;
      ctx.beginPath(); ctx.ellipse(lx, ly, 9*scale, 20*scale, Math.PI/4, 0, Math.PI*2); ctx.fill();
    }
  } else if (style === 'hearts') {
    ctx.fillStyle = color + '80';
    for (let i = 0; i < 10; i++) {
      const hx = (i%5)*(W/4)+4, hy = Math.floor(i/5)*(H*0.55)+10;
      ctx.font = `${9*scale*W/100}px serif`; ctx.textAlign='left'; ctx.fillText('♥', hx, hy);
    }
  } else if (style === 'stars') {
    ctx.fillStyle = color + '80';
    for (let i = 0; i < 15; i++) {
      const sx = ((i * 137.5) % 100) / 100 * W;
      const sy = ((i * 97.3)  % 100) / 100 * H;
      ctx.font = `${8*scale*W/100}px serif`; ctx.textAlign='center'; ctx.fillText('★', sx, sy);
    }
  } else if (style === 'zigzag') {
    ctx.strokeStyle = color + '70'; ctx.lineWidth = 2 * scale;
    const zsp = 16 * scale;
    for (let y = 0; y < H; y += zsp) {
      ctx.beginPath();
      for (let x = 0; x < W; x += 12 * scale) ctx.lineTo(x, y + (x % (24*scale) < 12*scale ? 0 : 8*scale));
      ctx.stroke();
    }
  }
}

function drawAll() { renderToCanvas(ctx, PREVIEW_W, PREVIEW_H, 1, true); }

function exportHD() {
  const off = document.createElement('canvas');
  off.width = HD_W; off.height = HD_H;
  renderToCanvas(off.getContext('2d'), HD_W, HD_H, HD_SCALE, true);
  return off.toDataURL('image/png');
}

// ══════════════════════════════════════════════════════════════
// MODE SWITCHING
// ══════════════════════════════════════════════════════════════
function setMode(mode) {
  currentMode = mode;
  document.getElementById('modeBtnSticker').classList.toggle('active', mode === 'sticker');
  document.getElementById('modeBtnPhoto').classList.toggle('active', mode === 'photo');
  document.getElementById('stickerModePanel').style.display = mode === 'sticker' ? 'flex' : 'none';
  document.getElementById('photoModePanel').style.display   = mode === 'photo'   ? 'flex' : 'none';
  document.getElementById('panelTitle').textContent = mode === 'sticker' ? 'Stickers' : 'Photo Adjust';

  const badge = document.getElementById('modeBadge');
  badge.textContent = mode === 'sticker' ? 'STICKER MODE' : 'PHOTO MODE';
  badge.className = 'mode-badge ' + (mode === 'sticker' ? 'sticker-mode' : 'photo-mode');

  document.getElementById('canvasHint').textContent = mode === 'sticker'
    ? 'TAP STICKER → DRAG TO POSITION'
    : 'TAP PHOTO SLOT → DRAG TO REPOSITION';

  canvas.style.cursor = mode === 'sticker' ? 'crosshair' : 'pointer';

  if (mode === 'photo') {
    buildSlotList();
    document.getElementById('photoAdjBar').classList.remove('visible');
  } else {
    activePhotoSlot = null;
    document.getElementById('photoAdjBar').classList.remove('visible');
    document.getElementById('photoControlsBox').classList.remove('visible');
  }
  drawAll();
}

// ══════════════════════════════════════════════════════════════
// PHOTO MODE — Slot list
// ══════════════════════════════════════════════════════════════
function buildSlotList() {
  const list = document.getElementById('slotList');
  list.innerHTML = '';
  for (let i = 0; i < SLOTS; i++) {
    const item = document.createElement('div');
    item.className = 'slot-item' + (i === activePhotoSlot ? ' active' : '');
    item.innerHTML = `
      <span class="slot-num ${i === activePhotoSlot ? 'active-num' : ''}">${i + 1}</span>
      <div class="slot-info">
        <div class="slot-name">FOTO ${i + 1}</div>
        <div class="slot-sub">${preloadedImgs[i] ? 'Tap to adjust' : 'No photo'}</div>
      </div>
      <span class="slot-edit-icon">${i === activePhotoSlot ? '✏️' : '→'}</span>
    `;
    item.onclick = () => selectPhotoSlot(i);
    list.appendChild(item);
  }
}

function selectPhotoSlot(i) {
  activePhotoSlot = i;
  buildSlotList();

  // Sync sliders ke state slot ini
  const adj = photoAdj[i];
  const zs = document.getElementById('zoomSlider');
  const xs = document.getElementById('xSlider');
  const ys = document.getElementById('ySlider');
  zs.value = Math.round(adj.zoom * 100);
  xs.value = Math.round(adj.ox);
  ys.value = Math.round(adj.oy);
  updateSliderLabels();

  document.getElementById('photoControlsBox').classList.add('visible');

  // Sync juga bottom bar
  document.getElementById('adjZoom').value = Math.round(adj.zoom * 100);
  document.getElementById('adjX').value    = Math.round(adj.ox);
  document.getElementById('adjY').value    = Math.round(adj.oy);
  document.getElementById('photoAdjBar').classList.add('visible');

  // Show drag hint
  const hint = document.getElementById('dragHint');
  const r = getSlotRect(i, 1);
  hint.style.left = (r.x + r.w / 2) + 'px';
  hint.style.top  = (r.y - 22) + 'px';
  hint.style.transform = 'translateX(-50%)';
  hint.classList.add('show');
  setTimeout(() => hint.classList.remove('show'), 2000);

  drawAll();
}

function updateSliderLabels() {
  document.getElementById('zoomVal').textContent = document.getElementById('zoomSlider').value + '%';
  document.getElementById('xVal').textContent    = document.getElementById('xSlider').value;
  document.getElementById('yVal').textContent    = document.getElementById('ySlider').value;
}

function closePhotoAdjust() {
  document.getElementById('photoAdjBar').classList.remove('visible');
  activePhotoSlot = null;
  buildSlotList();
  document.getElementById('photoControlsBox').classList.remove('visible');
  drawAll();
}

function resetCurrentSlot() {
  if (activePhotoSlot === null) return;
  photoAdj[activePhotoSlot] = { zoom: 1.0, ox: 0, oy: 0 };
  document.getElementById('zoomSlider').value = 100;
  document.getElementById('xSlider').value    = 0;
  document.getElementById('ySlider').value    = 0;
  document.getElementById('adjZoom').value    = 100;
  document.getElementById('adjX').value       = 0;
  document.getElementById('adjY').value       = 0;
  updateSliderLabels();
  drawAll();
}

// Panel sliders → update state
document.getElementById('zoomSlider').addEventListener('input', function() {
  if (activePhotoSlot !== null) {
    photoAdj[activePhotoSlot].zoom = parseInt(this.value) / 100;
    document.getElementById('adjZoom').value = this.value;
    updateSliderLabels(); drawAll();
  }
});
document.getElementById('xSlider').addEventListener('input', function() {
  if (activePhotoSlot !== null) {
    photoAdj[activePhotoSlot].ox = parseInt(this.value);
    document.getElementById('adjX').value = this.value;
    updateSliderLabels(); drawAll();
  }
});
document.getElementById('ySlider').addEventListener('input', function() {
  if (activePhotoSlot !== null) {
    photoAdj[activePhotoSlot].oy = parseInt(this.value);
    document.getElementById('adjY').value = this.value;
    updateSliderLabels(); drawAll();
  }
});

// Bottom bar sliders → update state
document.getElementById('adjZoom').addEventListener('input', function() {
  if (activePhotoSlot !== null) {
    photoAdj[activePhotoSlot].zoom = parseInt(this.value) / 100;
    document.getElementById('zoomSlider').value = this.value;
    updateSliderLabels(); drawAll();
  }
});
document.getElementById('adjX').addEventListener('input', function() {
  if (activePhotoSlot !== null) {
    photoAdj[activePhotoSlot].ox = parseInt(this.value);
    document.getElementById('xSlider').value = this.value;
    updateSliderLabels(); drawAll();
  }
});
document.getElementById('adjY').addEventListener('input', function() {
  if (activePhotoSlot !== null) {
    photoAdj[activePhotoSlot].oy = parseInt(this.value);
    document.getElementById('ySlider').value = this.value;
    updateSliderLabels(); drawAll();
  }
});

// ══════════════════════════════════════════════════════════════
// STICKER DATA
// ══════════════════════════════════════════════════════════════
const STICKERS = {
  all:    ['😊','🌸','✨','💜','🌈','🎀','💫','⭐','🦋','🌺','💖','🎉','🌙','☁️','🍀','🌻','💐','🎊','🦄','🌷','😍','🥳','💅','🌟'],
  face:   ['😊','😍','🥳','😎','🤩','😘','🥰','😜','🤪','😇'],
  nature: ['🌸','🌺','🌻','🌷','🌹','🍀','🌙','☁️','⭐','🌈'],
  fun:    ['✨','💫','🎀','💜','💖','🎉','🎊','🦄','💅','🌟'],
};

function buildStickerGrid(cat = 'all') {
  const grid = document.getElementById('stickerGrid'); grid.innerHTML = '';
  STICKERS[cat].forEach(e => {
    const el = document.createElement('div'); el.className = 'sticker-item'; el.textContent = e;
    el.addEventListener('click', () => addSticker(e)); grid.appendChild(el);
  });
}

function addSticker(e) {
  placed.push({ emoji: e, x: PREVIEW_W/2, y: PREVIEW_H/2, size: 50, rot: 0 });
  selIdx = placed.length - 1;
  updateStickerControls(); drawAll();
}

function updateStickerControls() {
  if (selIdx === null || !placed[selIdx]) return;
  document.getElementById('sizeSlider').value = placed[selIdx].size;
  document.getElementById('rotSlider').value  = placed[selIdx].rot;
}

function deleteSelected() {
  if (selIdx === null) return;
  placed.splice(selIdx, 1); selIdx = null; drawAll();
}

document.getElementById('sizeSlider').addEventListener('input', function(){
  if (selIdx !== null && placed[selIdx]) { placed[selIdx].size = +this.value; drawAll(); }
});
document.getElementById('rotSlider').addEventListener('input', function(){
  if (selIdx !== null && placed[selIdx]) { placed[selIdx].rot = +this.value; drawAll(); }
});

// ══════════════════════════════════════════════════════════════
// POINTER EVENTS (unified mouse + touch)
// ══════════════════════════════════════════════════════════════
function getPos(e) {
  const r  = canvas.getBoundingClientRect();
  const cl = e.touches ? e.touches[0] : e;
  return {
    x: (cl.clientX - r.left) * (canvas.width  / r.width),
    y: (cl.clientY - r.top)  * (canvas.height / r.height),
  };
}

function hitTestSticker(p) {
  for (let i = placed.length - 1; i >= 0; i--) {
    const s = placed[i], hw = s.size / 2;
    if (Math.abs(p.x - s.x) < hw && Math.abs(p.y - s.y) < hw) return i;
  }
  return -1;
}

function onPointerDown(e) {
  const p = getPos(e);

  if (currentMode === 'sticker') {
    const h = hitTestSticker(p);
    if (h >= 0) {
      selIdx = h; dragging = h;
      dragOffX = p.x - placed[h].x; dragOffY = p.y - placed[h].y;
      updateStickerControls();
    } else { selIdx = null; }
    drawAll();

  } else if (currentMode === 'photo') {
    // Cek apakah klik di dalam slot yang aktif → mulai drag foto
    if (activePhotoSlot !== null) {
      const r = getSlotRect(activePhotoSlot, 1);
      if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) {
        photoDragging = true;
        photoDragSlot = activePhotoSlot;
        photoDragStartX = p.x; photoDragStartY = p.y;
        photoDragStartOx = photoAdj[activePhotoSlot].ox;
        photoDragStartOy = photoAdj[activePhotoSlot].oy;
        canvas.style.cursor = 'grabbing';
        return;
      }
    }
    // Klik di slot lain → pilih slot itu
    const slotIdx = hitSlot(p.x, p.y);
    if (slotIdx >= 0) selectPhotoSlot(slotIdx);
  }
}

function onPointerMove(e) {
  const p = getPos(e);

  if (currentMode === 'sticker' && dragging !== null) {
    placed[dragging].x = p.x - dragOffX;
    placed[dragging].y = p.y - dragOffY;
    drawAll();
  } else if (currentMode === 'photo' && photoDragging) {
    const dx = p.x - photoDragStartX;
    const dy = p.y - photoDragStartY;
    // Sensitivitas: gerak 50px = offset 100%
    const sensitivity = 2.0;
    photoAdj[photoDragSlot].ox = Math.max(-100, Math.min(100, photoDragStartOx - dx * sensitivity));
    photoAdj[photoDragSlot].oy = Math.max(-100, Math.min(100, photoDragStartOy - dy * sensitivity));

    // Sync slider
    document.getElementById('xSlider').value    = Math.round(photoAdj[photoDragSlot].ox);
    document.getElementById('ySlider').value    = Math.round(photoAdj[photoDragSlot].oy);
    document.getElementById('adjX').value       = Math.round(photoAdj[photoDragSlot].ox);
    document.getElementById('adjY').value       = Math.round(photoAdj[photoDragSlot].oy);
    updateSliderLabels();
    drawAll();
  }
}

function onPointerUp() {
  dragging = null;
  if (photoDragging) { photoDragging = false; canvas.style.cursor = 'pointer'; }
}

// Mouse events
canvas.addEventListener('mousedown', e => { e.preventDefault(); onPointerDown(e); });
canvas.addEventListener('mousemove', e => onPointerMove(e));
canvas.addEventListener('mouseup',   () => onPointerUp());
canvas.addEventListener('mouseleave',() => onPointerUp());

// Touch events
canvas.addEventListener('touchstart', e => { e.preventDefault(); onPointerDown(e); }, { passive: false });
canvas.addEventListener('touchmove',  e => { e.preventDefault(); onPointerMove(e); }, { passive: false });
canvas.addEventListener('touchend',   () => onPointerUp());

// Scroll zoom di canvas (saat photo mode & slot aktif)
canvas.addEventListener('wheel', e => {
  if (currentMode !== 'photo' || activePhotoSlot === null) return;
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.05 : 0.05;
  const newZoom = Math.max(1.0, Math.min(3.0, photoAdj[activePhotoSlot].zoom + delta));
  photoAdj[activePhotoSlot].zoom = newZoom;
  document.getElementById('zoomSlider').value = Math.round(newZoom * 100);
  document.getElementById('adjZoom').value    = Math.round(newZoom * 100);
  updateSliderLabels();
  drawAll();
}, { passive: false });

// ── Category tabs ────────────────────────────────────────────
document.querySelectorAll('.scat').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.scat').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); buildStickerGrid(b.dataset.cat);
}));

// ══════════════════════════════════════════════════════════════
// NEXT
// ══════════════════════════════════════════════════════════════
async function goNext() {
  const btn = document.getElementById('nextBtn');
  btn.disabled = true; btn.textContent = 'PROCESSING...';
  await new Promise(r => requestAnimationFrame(() => setTimeout(r, 60)));
  try {
    const finalImg = exportHD();
    localStorage.setItem('finalStrip', finalImg);
    const fId = localStorage.getItem('selectedFrameId');
    if (fId) DB.incrementFrameUse(fId);
    DB.saveStrip(finalImg, fId);
    window.location.href = 'result.html';
  } catch(err) {
    console.error(err);
    btn.disabled = false; btn.textContent = 'NEXT →';
    alert('Gagal export. Coba lagi.');
  }
}

// ── Init ─────────────────────────────────────────────────────
buildStickerGrid();
preloadAll(() => { drawAll(); });
